name: Cloud Security Platform — CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, integration/team-branches]
  workflow_dispatch:
    inputs:
      analysis_json:
        description: "분석 결과 JSON 경로 (ai-report 수동 실행 시)"
        required: false
        default: ""

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ================================================================
  # JOB 1: 코드 검증 — 모든 PR 및 push에서 실행
  #   Python 전 모듈 문법·테스트 + Terraform fmt/validate + tfsec
  # ================================================================
  validate:
    name: "[CI] Validate & Test"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r compliance/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Python syntax check — all modules
        run: |
          python -m py_compile \
            analyzer/main.py \
            analyzer/waf_analyzer.py \
            analyzer/cti_checker.py \
            analyzer/config.py \
            attack_simulation/attack_runner.py \
            monitoring/json_server.py \
            compliance/render.py \
            compliance/pr_collector.py \
            ai/report_generator.py \
            ai/prompts.py

      - name: Run tests
        run: pytest -q --tb=short

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init & validate
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

      - name: tfsec — Terraform 보안 취약점 검사
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true

  # ================================================================
  # JOB 2: Infracost 비용 분석 — PR에서만 실행, 결과를 PR 댓글로 게시
  #   기획서 4.5: "정책 변경 시 발생 가능한 월 비용 영향 분석"
  #   GitHub repo secret에 INFRACOST_API_KEY 등록 필요
  #   (https://www.infracost.io/docs/integrations/github_actions/)
  # ================================================================
  infracost:
    name: "[CI] Infracost — WAF 정책 변경 비용 사전 분석"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Infracost breakdown (base branch)
        run: |
          infracost breakdown \
            --path terraform \
            --format json \
            --out-file /tmp/infracost-base.json
        env:
          INFRACOST_TERRAFORM_WORKSPACE: default

      - name: Post Infracost comment on PR
        run: |
          infracost comment github \
            --path /tmp/infracost-base.json \
            --repo ${{ github.repository }} \
            --github-token ${{ secrets.GITHUB_TOKEN }} \
            --pull-request ${{ github.event.pull_request.number }} \
            --behavior update

  # ================================================================
  # JOB 3: 보안 분석 파이프라인 — main 병합 시 자동 실행
  #   analyzer → compliance 보고서 → PR 이력 수집 → artifact 저장
  # ================================================================
  security-pipeline:
    name: "[CD] Security Analysis Pipeline"
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r compliance/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: "[1/3] WAF 로그 분석 (Python Analyzer + CTI)"
        run: python analyzer/main.py --source analyzer/tests/fixtures

      - name: "[2/3] 컴플라이언스 감사 보고서 생성 (HTML + PDF)"
        run: |
          python compliance/build_data.py
          python compliance/render.py

      - name: "[3/3] PR 이력 수집 (변경관리 증적 — ISMS-P 2.10.1)"
        run: python compliance/pr_collector.py --merged-only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_number }}
          path: |
            output/
            compliance/output/
          retention-days: 30

  # ================================================================
  # JOB 3-B: EC2 자동 배포 — main push 시 코드 반영 + 컨테이너 재시작
  #   필요 GitHub Secrets: EC2_HOST, EC2_SSH_PRIVATE_KEY
  # ================================================================
  deploy-ec2:
    name: "[CD] Deploy to EC2 (Grafana 스택 갱신)"
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: SSH — git pull + 의존성 갱신 + 컨테이너 재시작
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/cloud-security-platform

            # 코드 최신화
            git pull --ff-only

            # Python 의존성 — requirements 변경 시 자동 갱신
            PYTHON=".venv/bin/pip"
            if [ ! -f ".venv/bin/activate" ]; then
              python3.11 -m venv .venv
            fi
            $PYTHON install --upgrade pip --quiet
            $PYTHON install -r requirements.txt --quiet
            [ -f compliance/requirements.txt ] && $PYTHON install -r compliance/requirements.txt --quiet

            # 한국어 폰트 (없으면 설치)
            if ! fc-list :lang=ko 2>/dev/null | grep -q "Noto"; then
              sudo yum install -y --quiet google-noto-sans-cjk-ttc-fonts 2>/dev/null || true
            fi

            # Grafana 대시보드는 provisioning 디렉터리를 볼륨 마운트로 공유하므로
            # git pull 후 10초 이내 Grafana가 자동 감지 → 컨테이너 재시작 불필요
            # json-api: 코드 변경 반영, fluent-bit: 로그 파이프라인 안정화
            docker restart json-api fluent-bit

            echo "[OK] 배포 완료: $(date)"
        continue-on-error: true

  # ================================================================
  # JOB 4: AWS 인프라 배포
  #   기획서 4.4: "승인된 정책은 GitHub Actions를 통해 Terraform 코드로 반영"
  #   - terraform/ 변경 포함 push(main) 시 자동 실행 (WAF PR 머지 포함)
  #   - workflow_dispatch 수동 실행도 가능
  # ================================================================
  deploy:
    name: "[CD] Deploy to AWS (Terraform Apply)"
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform init
        run: terraform -chdir=terraform init -backend-config=backend.hcl

      - name: Terraform refresh — 실제 AWS 상태 동기화
        run: terraform -chdir=terraform refresh
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Terraform plan
        run: terraform -chdir=terraform plan -out=tfplan
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Terraform apply → AWS WAF 정책 업데이트
        run: terraform -chdir=terraform apply -auto-approve tfplan
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

  # ================================================================
  # JOB 5 (수동): AI 보안 보고서 생성
  #   Ollama 로컬 LLM 의존 → workflow_dispatch로 수동 트리거
  #   사전 조건: self-hosted runner에 ollama + llama3.1:8b 설치 필요
  #   실행: Actions 탭 → "Run workflow" → analysis_json 경로 입력 (선택)
  # ================================================================
  ai-report:
    name: "[Manual] AI Security Report (Ollama)"
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install AI dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analyzer (입력 JSON 없을 때 샘플로 실행)
        if: github.event.inputs.analysis_json == ''
        run: python analyzer/main.py --source analyzer/tests/fixtures

      - name: Generate AI security report (LangChain + Ollama)
        run: |
          if [ -n "${{ github.event.inputs.analysis_json }}" ]; then
            INPUT="${{ github.event.inputs.analysis_json }}"
          else
            INPUT=$(ls -t output/analysis_*.json | head -1)
          fi
          python ai/report_generator.py "$INPUT"
        env:
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}

      - name: Upload AI report
        uses: actions/upload-artifact@v4
        with:
          name: ai-report-${{ github.run_number }}
          path: output/
          retention-days: 30
