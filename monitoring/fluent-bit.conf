[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    warn
    Parsers_File parsers.conf

# ── INPUT: 파이프라인이 생성하는 WAF 이벤트 스트림 ──────────────────
[INPUT]
    Name              tail
    Path              /logs/output/live_waf.jsonl
    Tag               waf.live
    Refresh_Interval  5
    Read_from_Head    True
    Parser            waf_json
    DB                /tmp/waf_live.db

# ── FILTER: 공통 메타데이터 ────────────────────────────────────────
[FILTER]
    Name   record_modifier
    Match  waf.live
    Record source cloud-security-platform

# ── OUTPUT: WAF 이벤트 → Loki (action 레이블로 BLOCK/ALLOW 분리) ──
[OUTPUT]
    Name                loki
    Match               waf.live
    Host                loki
    Port                3100
    Labels              job=waf_logs,source=fluent-bit
    Label_Keys          $action,$country
    Line_Format         json
    Auto_Kubernetes_Labels off
