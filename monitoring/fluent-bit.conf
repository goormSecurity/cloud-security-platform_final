# Fluent Bit 설정 — 로컬 WAF 로그 수집 → Loki 전송
# 로컬: analyzer/sample_logs/, output/ 폴더 감시
# EC2 배포 시: /var/log/waf/ 경로로 변경

[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

# ── INPUT: WAF 샘플 로그 (로컬 개발용) ─────────────────────────
[INPUT]
    Name              tail
    Path              /logs/sample_logs/*.log,/logs/sample_logs/*.json
    Tag               waf.sample
    Refresh_Interval  5
    Read_from_Head    True
    Multiline         Off

# ── INPUT: Analyzer 출력 JSON (output/) ──────────────────────────
[INPUT]
    Name              tail
    Path              /logs/output/analysis_*.json
    Tag               analyzer.output
    Refresh_Interval  10
    Read_from_Head    True

# ── PARSER: WAF JSON 로그 ────────────────────────────────────────
[FILTER]
    Name   parser
    Match  waf.*
    Key_Name log
    Parser json
    Reserve_Data True

# ── FILTER: 기본 메타데이터 추가 ─────────────────────────────────
[FILTER]
    Name   record_modifier
    Match  *
    Record source cloud-security-platform
    Record environment local

# ── OUTPUT: Loki ─────────────────────────────────────────────────
[OUTPUT]
    Name            loki
    Match           waf.*
    Host            loki
    Port            3100
    Labels          job=waf_logs,source=fluent-bit
    Label_Keys      $action,$httpRequest_country
    Line_Format     json
    Auto_Kubernetes_Labels off

[OUTPUT]
    Name            loki
    Match           analyzer.*
    Host            loki
    Port            3100
    Labels          job=analyzer_output,source=fluent-bit
    Line_Format     json
    Auto_Kubernetes_Labels off

# ── OUTPUT: 로컬 stdout (디버그용) ──────────────────────────────
[OUTPUT]
    Name   stdout
    Match  *
    Format json_lines
