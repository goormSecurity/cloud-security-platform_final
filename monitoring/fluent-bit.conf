[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

# ── INPUT: 실제 AWS WAF 로그 (waf_latest/) ─────────────────────
[INPUT]
    Name              tail
    Path              /logs/output/waf_latest/*
    Tag               waf.raw
    Refresh_Interval  5
    Read_from_Head    True
    Parser            json
    DB                /tmp/waf_pos.db

# ── INPUT: Analyzer 출력 JSON (output/) ──────────────────────────
[INPUT]
    Name              tail
    Path              /logs/output/analysis_*.json
    Tag               analyzer.output
    Refresh_Interval  10
    Read_from_Head    True

# ── FILTER: 공통 메타데이터 추가 ─────────────────────────────────
[FILTER]
    Name   record_modifier
    Match  *
    Record source cloud-security-platform
    Record environment local

# ── OUTPUT: WAF 요청 로그 → Loki ─────────────────────────────────
[OUTPUT]
    Name            loki
    Match           waf.raw
    Host            loki
    Port            3100
    Labels          job=waf_logs,source=fluent-bit
    Label_Keys      $action
    Line_Format     json
    Auto_Kubernetes_Labels off

# ── OUTPUT: Analyzer 결과 → Loki ─────────────────────────────────
[OUTPUT]
    Name            loki
    Match           analyzer.*
    Host            loki
    Port            3100
    Labels          job=analyzer_output,source=fluent-bit
    Line_Format     json
    Auto_Kubernetes_Labels off
