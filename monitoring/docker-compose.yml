services:
  # ── Loki: 로그 저장소 ─────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: loki
    user: "0"
    ports:
      - "4100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/tmp/loki

  # ── Fluent Bit: 로그 수집 에이전트 ───────────────────────────
  fluent-bit:
    image: grafana/fluent-bit-plugin-loki:latest
    container_name: fluent-bit
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./parsers.conf:/fluent-bit/etc/parsers.conf
      - ../output:/logs/output:ro
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

  # ── JSON API 서버: Analyzer 결과 노출 ───────────────────────
  json-api:
    image: python:3.11-slim
    container_name: json-api
    working_dir: /app
    command: >
      sh -c "pip install flask flask-cors -q &&
             python json_server.py"
    volumes:
      - ./json_server.py:/app/json_server.py
      - ../output:/app/data:ro
      - ../compliance/input:/app/compliance:ro
    ports:
      - "5000:5000"
    restart: unless-stopped

  # ── Grafana: 시각화 대시보드 ─────────────────────────────────
  grafana:
    image: grafana/grafana:9.5.21
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123!
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning
      - ./dashboards:/var/lib/grafana/dashboards
    depends_on:
      loki:
        condition: service_started
      json-api:
        condition: service_started
    restart: unless-stopped

volumes:
  grafana-data:
  loki-data:
